openapi: 3.1.0
info:
  title: Organon Personal API
  version: 0.1.0
  summary: Headless Org-mode as your personal API.
  description: |
    Tasks and notes live in plain Org files; this API is the only way clients
    read and change them. Everything that has a meaning in Org (state changes,
    repeaters, deadline warnings, agenda membership) is computed by Org itself,
    and everything about notes (IDs, links, backlinks) by org-roam.

    **Dates and instants.** Planning dates (`scheduled`, `deadline`) are
    calendar dates with an optional wall-clock time in the instance's calendar
    zone (`GET /api/v1/meta` → `calendar_tz`); they carry no offset. Instants
    (`closed_at`) are RFC 3339 UTC.

    Behavior is specified in `openspec/` (capabilities task-lifecycle,
    task-recurrence, agenda-queries, time-model, api-access, knowledge-nodes,
    knowledge-index).
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:8080
security:
  - bearer: []
tags:
  - name: system
    description: Health and instance metadata.
  - name: tasks
    description: Tasks (Org headings with a TODO state) and their state changes.
  - name: agenda
    description: The Org agenda for a day.
  - name: projects
    description: Projects (level-1 headings in org/projects/) that group tasks.
  - name: nodes
    description: |
      Knowledge nodes: org-roam nodes (files or headings with an ID) that are
      not tasks, and the links between nodes and tasks.

paths:
  /healthz:
    get:
      tags: [system]
      operationId: health
      summary: Health of the API and the engine
      security: []
      responses:
        "200":
          description: The engine answers.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { const: ok }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/meta:
    get:
      tags: [system]
      operationId: getMeta
      summary: Instance metadata
      responses:
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Meta" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/agenda:
    get:
      tags: [agenda]
      operationId: getAgenda
      summary: The Org agenda for one day
      description: |
        Every entry Org Agenda shows for the day when that day is the current
        day: deadline warnings and overdue items apply to it.
      parameters:
        - $ref: "#/components/parameters/date"
      responses:
        "200":
          description: Agenda entries in agenda order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AgendaList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/today:
    get:
      tags: [tasks]
      operationId: listTodayTasks
      summary: Open tasks on the day's agenda
      parameters:
        - $ref: "#/components/parameters/date"
      responses:
        "200": { $ref: "#/components/responses/TaskListWithAgenda" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/overdue:
    get:
      tags: [tasks]
      operationId: listOverdueTasks
      summary: Tasks on the day's agenda that are past-scheduled or past their deadline
      parameters:
        - $ref: "#/components/parameters/date"
      responses:
        "200": { $ref: "#/components/responses/TaskListWithAgenda" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/waiting:
    get:
      tags: [tasks]
      operationId: listWaitingTasks
      summary: All WAITING tasks, with or without dates
      responses:
        "200": { $ref: "#/components/responses/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/completed:
    get:
      tags: [tasks]
      operationId: listCompletedTasks
      summary: Tasks completed on a day, including repeating tasks
      parameters:
        - $ref: "#/components/parameters/date"
      responses:
        "200": { $ref: "#/components/responses/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasks by state, project and tag, with or without dates
      description: |
        Tasks in `org/tasks/` and `org/projects/`, in file order. Without
        `state`, the open states (TODO, NEXT, DOING, WAITING) are listed.
        Filters combine with AND; `tag` matches the task's own tags.
      parameters:
        - name: state
          in: query
          required: false
          description: Comma-separated states, e.g. `NEXT` or `DONE,CANCELLED`.
          schema:
            type: string
            pattern: "^(TODO|NEXT|DOING|WAITING|DONE|CANCELLED)(,(TODO|NEXT|DOING|WAITING|DONE|CANCELLED))*$"
        - name: project
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ID" }
        - name: tag
          in: query
          required: false
          schema: { type: string, pattern: "^[\\p{L}\\p{M}\\p{Nl}\\p{Nd}_@#%]+$" }
      responses:
        "200": { $ref: "#/components/responses/TaskList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: Create a task in the inbox or under a project
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201":
          description: The created task.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: A task by its stable ID
      parameters:
        - $ref: "#/components/parameters/id"
      responses:
        "200":
          description: The task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

    patch:
      tags: [tasks]
      operationId: updateTask
      summary: Change some fields of a task
      description: |
        Only the fields present change. `null` clears `priority`,
        `scheduled`, `deadline` and `repeat_to_state`. A planning date that is
        sent replaces the old one entirely, repeater and warning included.
        `expected_version` (the task's `version`) is required.
      parameters:
        - $ref: "#/components/parameters/id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTask" }
      responses:
        "200":
          description: The task after the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/tasks/{id}/{action}:
    post:
      tags: [tasks]
      operationId: transitionTask
      summary: Change a task's state
      description: |
        - `start` → DOING, `wait` → WAITING, `complete` → DONE.
        - `skip` → CANCELLED for this occurrence; a repeating task moves to
          its next occurrence.
        - `cancel` → CANCELLED and, for a repeating task, ends the series.
        - `todo` → TODO, `next` → NEXT; on a closed task this reopens it.

        `expected_state` is always required. `expected_version` (the task's
        `version`) is required for repeating tasks, which return to an open
        state after completion: without it a retried request could not be
        told apart from a new one.
      parameters:
        - $ref: "#/components/parameters/id"
        - name: action
          in: path
          required: true
          schema:
            type: string
            enum: [start, wait, complete, skip, cancel, todo, next]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Transition" }
      responses:
        "200":
          description: The task after the transition.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransitionResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: All projects with their number of open tasks
      responses:
        "200":
          description: Projects.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProjectList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }
    post:
      tags: [projects]
      operationId: createProject
      summary: Create a project (a new file under projects/)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProject" }
      responses:
        "201":
          description: The created project.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/nodes:
    get:
      tags: [nodes]
      operationId: searchNodes
      summary: Find nodes by title, alias and tag
      description: |
        Nodes outside `org/archive/`, ordered by title. `q` keeps nodes whose
        title or an alias contains it, ignoring case; `tag` keeps nodes with
        that tag. Filters combine with AND; without them every node is listed.
        Tasks are never listed.
      parameters:
        - name: q
          in: query
          required: false
          description: Text to look for in titles and aliases.
          schema: { type: string, maxLength: 200 }
        - name: tag
          in: query
          required: false
          schema: { type: string, pattern: "^[\\p{L}\\p{M}\\p{Nl}\\p{Nd}_@#%]+$" }
      responses:
        "200":
          description: Matching nodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NodeList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }
    post:
      tags: [nodes]
      operationId: createNode
      summary: Create a node (a new file under org/knowledge/)
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateNode" }
      responses:
        "201":
          description: The created node.
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/nodes/{id}:
    get:
      tags: [nodes]
      operationId: getNode
      summary: A node by its stable ID
      parameters:
        - $ref: "#/components/parameters/nodeId"
      responses:
        "200":
          description: The node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/nodes/{id}/backlinks:
    get:
      tags: [nodes]
      operationId: getNodeBacklinks
      summary: Nodes and tasks that link to the node
      description: |
        Every node and task with an Org `id:` link to this node, once per
        source, ordered by title. Archived files are included.
      parameters:
        - $ref: "#/components/parameters/nodeId"
      responses:
        "200": { $ref: "#/components/responses/NodeRefList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

  /api/v1/nodes/{id}/links:
    get:
      tags: [nodes]
      operationId: getNodeLinks
      summary: Nodes and tasks the node links to
      description: |
        The targets of the node's Org `id:` links, once per target, ordered by
        title. Links to IDs that no entry has are left out.
      parameters:
        - $ref: "#/components/parameters/nodeId"
      responses:
        "200": { $ref: "#/components/responses/NodeRefList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Invalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/EngineUnavailable" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Tokens are created with `organon token new` and carry scopes:
        `read` for every GET, `tasks:write` for creating and changing tasks
        and projects, `nodes:write` for creating nodes. No scope implies
        another.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Retrying with the same key and body returns the original response
        instead of creating the resource again (held in memory for 24 h,
        per token and endpoint).
      schema: { type: string, maxLength: 200 }
    id:
      name: id
      in: path
      required: true
      description: The task's Org ID (a lowercase UUID).
      schema: { $ref: "#/components/schemas/ID" }
    nodeId:
      name: id
      in: path
      required: true
      description: The node's Org ID (a lowercase UUID).
      schema: { $ref: "#/components/schemas/ID" }
    date:
      name: date
      in: query
      required: false
      description: Calendar date; defaults to today in the instance calendar zone.
      schema: { $ref: "#/components/schemas/Date" }

  responses:
    TaskList:
      description: Tasks.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskList" }
    NodeRefList:
      description: Linked nodes and tasks.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NodeRefList" }
    TaskListWithAgenda:
      description: Tasks; each carries `agenda`, the reason it is on the agenda.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/TaskList" }
    Unauthorized:
      description: Missing or invalid bearer token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: The token lacks the required scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: No such task, project, node or endpoint.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        The task is not in `expected_state` / `expected_version` (the problem
        carries `actual_state` and `actual_version`), or an idempotent request
        with the same key is still in progress.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Invalid:
      description: The request is malformed or violates a rule.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: Too many failed authentication attempts from this address.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    EngineUnavailable:
      description: The engine is not reachable, not configured, or did not answer in time.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    ID:
      type: string
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    Date:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      examples: ["2026-10-25"]
    State:
      type: string
      enum: [TODO, NEXT, DOING, WAITING, DONE, CANCELLED]

    Timestamp:
      type: object
      description: A planning date in the calendar zone.
      required: [date, time, repeat, warning_days]
      properties:
        date: { $ref: "#/components/schemas/Date" }
        time:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        repeat:
          type: [string, "null"]
          description: Org repeater, e.g. `+1m`, `++1w`, `.+3d`.
          pattern: "^(\\+|\\+\\+|\\.\\+)[1-9][0-9]{0,2}[hdwmy]$"
        warning_days:
          type: [integer, "null"]
          minimum: 1
          description: Days before a deadline from which it shows as upcoming.

    TimestampInput:
      type: object
      required: [date]
      additionalProperties: false
      properties:
        date: { $ref: "#/components/schemas/Date" }
        time: { type: [string, "null"], pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$" }
        repeat: { type: [string, "null"], pattern: "^(\\+|\\+\\+|\\.\\+)[1-9][0-9]{0,2}[hdwmy]$" }
        warning_days: { type: [integer, "null"], minimum: 1, maximum: 365 }

    ProjectRef:
      type: object
      required: [id, title]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }

    AgendaKind:
      type: string
      enum: [scheduled, past-scheduled, deadline, upcoming-deadline, event]

    AgendaInfo:
      type: object
      required: [kind, date]
      properties:
        kind: { $ref: "#/components/schemas/AgendaKind" }
        date:
          $ref: "#/components/schemas/Date"
          description: Date of the timestamp that put the entry on the agenda.

    Task:
      type: object
      required: [id, title, state, priority, tags, scheduled, deadline, repeat_to_state,
                 closed_at, project, body, version, location_hint]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        state: { $ref: "#/components/schemas/State" }
        priority:
          oneOf:
            - { type: string, enum: [A, B, C] }
            - type: "null"
        tags:
          type: array
          items: { type: string }
        scheduled:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        deadline:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        repeat_to_state:
          oneOf:
            - { type: string, enum: [TODO, NEXT] }
            - type: "null"
        closed_at:
          type: [string, "null"]
          format: date-time
          description: When the task was last closed (DONE or CANCELLED), UTC.
        project:
          oneOf:
            - $ref: "#/components/schemas/ProjectRef"
            - type: "null"
        body: { type: string }
        version:
          type: string
          description: Opaque; changes whenever the task's entry changes.
        location_hint:
          type: string
          description: File the task is in, for debugging only. Not an identifier; do not rely on it.
        agenda:
          $ref: "#/components/schemas/AgendaInfo"
          description: Present in agenda-based lists (today, overdue).

    AgendaEntry:
      type: object
      required: [kind, date, id, title, task]
      properties:
        kind: { $ref: "#/components/schemas/AgendaKind" }
        date: { $ref: "#/components/schemas/Date" }
        id:
          oneOf:
            - $ref: "#/components/schemas/ID"
            - type: "null"
        title: { type: string }
        task:
          description: The task, or null for an event (an entry without a TODO state).
          oneOf:
            - $ref: "#/components/schemas/Task"
            - type: "null"

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }

    AgendaList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AgendaEntry" }

    CreateTask:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
          description: |
            One line. Must not contain a priority cookie (`[#A]`), start with
            `COMMENT`, or end with a tag list (`:tag:`). Active timestamps
            are stored inactive.
        body:
          type: string
          description: Free text. Stored so it cannot create Org structure; active timestamps are stored inactive.
        state: { type: string, enum: [TODO, NEXT], default: TODO }
        priority: { type: string, enum: [A, B, C] }
        tags:
          type: array
          description: "`ARCHIVE` is rejected: Org hides archived tasks from the agenda."
          items: { type: string, pattern: "^[\\p{L}\\p{M}\\p{Nl}\\p{Nd}_@#%]+$" }
        scheduled: { $ref: "#/components/schemas/TimestampInput" }
        deadline: { $ref: "#/components/schemas/TimestampInput" }
        repeat_to_state:
          type: string
          enum: [TODO, NEXT]
          description: State a repeating task returns to after completion (default NEXT).
        project_id:
          $ref: "#/components/schemas/ID"
          description: A level-1 heading in projects/; the task becomes its last child.

    UpdateTask:
      type: object
      required: [expected_version]
      minProperties: 2
      additionalProperties: false
      properties:
        expected_version: { type: string, description: The task's `version`. }
        title: { type: string, maxLength: 500 }
        body: { type: string }
        priority:
          oneOf:
            - { type: string, enum: [A, B, C] }
            - type: "null"
        tags:
          type: array
          items: { type: string, pattern: "^[\\p{L}\\p{M}\\p{Nl}\\p{Nd}_@#%]+$" }
        scheduled:
          oneOf:
            - $ref: "#/components/schemas/TimestampInput"
            - type: "null"
        deadline:
          oneOf:
            - $ref: "#/components/schemas/TimestampInput"
            - type: "null"
        repeat_to_state:
          oneOf:
            - { type: string, enum: [TODO, NEXT] }
            - type: "null"

    Project:
      type: object
      required: [id, title, open_tasks, location_hint]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        open_tasks:
          type: integer
          minimum: 0
          description: Tasks below the project in TODO, NEXT, DOING or WAITING.
        location_hint:
          type: string
          description: File the project is in, for debugging only. Not an identifier.

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Project" }

    CreateProject:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
          description: Same rules as task titles, and must not start with a task state such as TODO.
        body: { type: string }

    Node:
      type: object
      required: [id, title, aliases, tags, body, location_hint]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        aliases:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        body:
          type: string
          description: |
            The node's own text: for a file, the text before its first heading;
            for a heading, the text before its first child heading.
        location_hint:
          type: string
          description: File the node is in, for debugging only. Not an identifier; do not rely on it.

    NodeSummary:
      type: object
      required: [id, title, aliases, tags, location_hint]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        aliases:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        location_hint:
          type: string
          description: File the node is in, for debugging only. Not an identifier.

    NodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NodeSummary" }

    NodeRef:
      type: object
      required: [id, title, kind]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        kind:
          type: string
          enum: [node, task]
          description: Which endpoint reads the entry, `/api/v1/nodes/{id}` or `/api/v1/tasks/{id}`.

    NodeRefList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NodeRef" }

    CreateNode:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title:
          type: string
          maxLength: 500
          description: One line. Active timestamps are stored inactive.
        body:
          type: string
          description: |
            Org text below the title. Lines that would be Org structure
            (headings, keywords, drawers) are stored so they stay text; active
            timestamps are stored inactive. Org ID links
            (`[[id:<uuid>][label]]`) are kept and become links and backlinks.
        tags:
          type: array
          items: { type: string, pattern: "^[\\p{L}\\p{M}\\p{Nl}\\p{Nd}_@#%]+$" }
        aliases:
          type: array
          maxItems: 50
          description: Other names the node is found by. One line each.
          items: { type: string, maxLength: 500 }

    Transition:
      type: object
      required: [expected_state]
      additionalProperties: false
      properties:
        expected_state: { $ref: "#/components/schemas/State" }
        expected_version:
          type: string
          description: The task's `version`; required for repeating tasks.

    TransitionResult:
      type: object
      required: [task, warnings]
      properties:
        task: { $ref: "#/components/schemas/Task" }
        warnings:
          type: array
          items:
            type: string
            enum: [doing_limit_exceeded]

    Meta:
      type: object
      required: [calendar_tz, today, doing_limit, version, engine_version]
      properties:
        calendar_tz: { type: string, examples: ["Asia/Seoul"] }
        today: { $ref: "#/components/schemas/Date" }
        doing_limit: { type: integer, minimum: 1 }
        version: { type: string }
        engine_version: { type: string }

    Problem:
      type: object
      description: RFC 9457 problem details, with a stable machine-readable `code`.
      required: [type, title, status, code, detail]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [invalid, not_found, conflict, unauthorized, forbidden, rate_limited,
                 engine_unavailable, internal]
        detail: { type: string }
        actual_state: { $ref: "#/components/schemas/State" }
        actual_version: { type: string }
      additionalProperties: true
