# L2 checks (CONTRIBUTING.md): every pull request must pass all jobs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are not: each commit
# that passes is published as an image (see `publish`), and cancelling one
# halfway would leave pushed digests without tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the expensive jobs (unit, e2e) need to run. They are
  # skipped when either
  # - the change only touches documentation and specs (docs/, openspec/,
  #   .claude/, *.md, LICENSE) compared with the PR base or the previous main, or
  # - exactly this code tree already passed unit and e2e: `mark-tested` saves a
  #   cache entry keyed by a hash of every file outside those paths in the tree
  #   CI checked out (for a PR, the merge with the current base). An
  #   archive-only commit after review therefore costs no test run, while a
  #   moved base produces a different tree and runs everything again.
  # Caches written by pull requests are invisible to main, so a commit on main is
  # always tested (and published) for real. Pull requests from forks never skip:
  # their author controls the workflow file of earlier runs, so a cache entry
  # from those runs proves nothing.
  # Jobs are skipped with `if:` rather than path filters on the workflow, so that
  # required checks report "skipped" (which counts as passing) instead of
  # staying pending.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.decide.outputs.code }}
      tree: ${{ steps.tree.outputs.hash }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if grep -qvE '^(docs/|openspec/|\.claude/)|\.md$|^LICENSE$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
      - id: tree
        run: |
          hash=$(git ls-tree -r HEAD \
            | awk -F '\t' '$2 !~ /^(docs\/|openspec\/|\.claude\/)|\.md$|^LICENSE$/' \
            | sha256sum | cut -c1-40)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "code tree: $hash"
      - id: tested
        if: >-
          steps.diff.outputs.code == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-tested
          key: tested-${{ steps.tree.outputs.hash }}
          lookup-only: true
      - id: decide
        env:
          DIFF: ${{ steps.diff.outputs.code }}
          HIT: ${{ steps.tested.outputs.cache-hit }}
        run: |
          if [ "$DIFF" = true ] && [ "$HIT" = true ]; then
            echo "this code tree already passed unit and e2e; skipping them"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=$DIFF" >> "$GITHUB_OUTPUT"
          fi

  # Merge gate, kept separate so that its failure reads as "archive pending",
  # not as a broken build: a change whose tasks are all done must be archived
  # (openspec archive / /opsx:archive) before the pull request merges.
  archived:
    name: "openspec: changes archived"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: mise run spec:check-archived

  contracts:
    name: specs, OpenAPI, Quadlet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: mise run spec:validate
      - run: mise run lint:openapi
      - name: Generated Go types match the contract
        run: mise run check:generated
      - name: Quadlet units generate (dry run)
        run: QUADLET_UNIT_DIRS="$PWD/contrib/quadlet" /usr/libexec/podman/quadlet -dryrun -user
      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config -q

  unit:
    name: unit (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above" >&2; exit 1; }
      - name: go vet
        working-directory: api
        run: go vet ./... && go vet -tags e2e ./e2e/
      - name: go.mod and go.sum are tidy
        working-directory: api
        run: go mod tidy -diff || { echo "run go mod tidy in api/ and commit" >&2; exit 1; }
      - name: go test -race
        working-directory: api
        run: go test -race ./...
      - name: Build test image
        run: docker build -f container/Containerfile --target test -t organon:test .
      - name: ERT (inside the test image)
        run: CONTAINER_RUNTIME=docker mise run test:elisp

  e2e:
    name: e2e ${{ matrix.runtime }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: [compose, podman]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - name: Build image (Docker)
        if: matrix.runtime == 'compose'
        run: docker build -f container/Containerfile -t organon:dev .
      - name: Build image (Podman)
        if: matrix.runtime == 'podman'
        run: podman build -f container/Containerfile -t organon:dev .
      - name: e2e
        run: mise exec -- scripts/e2e.sh --runtime ${{ matrix.runtime }} -- -v
      - name: e2e as UID 12345
        if: matrix.runtime == 'podman'
        run: mise exec -- scripts/e2e.sh --runtime podman --uid 12345 -- -v

  # The one check to require in branch protection (together with
  # "openspec: changes archived"). Matrix jobs that are skipped report under
  # their unexpanded names ("unit (${{ matrix.arch }})"), so requiring the
  # per-architecture names would block every docs-only or archive-only pull
  # request. This job always runs and fails if any job it summarizes failed or
  # was cancelled; success and skipped both pass.
  required:
    name: required checks
    needs: [changes, contracts, unit, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$RESULTS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(", ")')
          if [ -n "$bad" ]; then echo "not passing: $bad" >&2; exit 1; fi

  # Records that this code tree passed unit and e2e (see `changes`).
  mark-tested:
    needs: [changes, unit, e2e]
    if: needs.unit.result == 'success' && needs.e2e.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "${{ needs.changes.outputs.tree }}" > .ci-tested
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-tested
          key: tested-${{ needs.changes.outputs.tree }}

  # Publishes every commit on main that passed CI to GHCR as one multi-arch
  # image tagged `sha-<7>` and `main` (openspec/specs/deployment: Published
  # images). Each architecture is built natively and pushed by digest; the
  # digests are then merged into one manifest list. Pull requests, forks and
  # commits whose unit or e2e jobs did not succeed never reach these jobs. Nor do
  # commits whose unit and e2e were skipped (documentation only, or a code tree
  # that already passed): the image would be the same, so `main` keeps pointing
  # at it and such a commit gets no `sha-<7>` tag of its own.
  publish:
    name: publish (${{ matrix.arch }})
    needs: [contracts, unit, e2e]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'FelisCatusKR/organon' &&
      needs.contracts.result == 'success' && needs.unit.result == 'success' &&
      needs.e2e.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/organon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: container/Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish (manifest)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/organon
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<<"$DOCKER_METADATA_OUTPUT_JSON")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Verify the published image
        run: |
          ref="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$ref"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')
          test "$platforms" = "amd64,arm64" || { echo "platforms: $platforms" >&2; exit 1; }
          test "$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest.Digest}}')" = \
               "$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}')"
          docker pull -q "$ref"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker run --rm "$ref" organon version)" = "main-${GITHUB_SHA::7}"
