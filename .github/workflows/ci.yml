# L2 checks (CONTRIBUTING.md): every pull request must pass all jobs.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main are not: each commit
# that passes is published as an image (see `publish`), and cancelling one
# halfway would leave pushed digests without tags.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the expensive jobs need to run. Documentation and spec-only
  # changes (docs/, openspec/, .claude/, *.md, LICENSE) run only `contracts`.
  # Jobs are skipped with `if:` rather than path filters on the workflow, so that
  # required checks report "skipped" (which counts as passing) instead of
  # staying pending. The comparison is against the PR base, so a docs-only
  # commit on top of a code PR still runs everything.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          if grep -qvE '^(docs/|openspec/|\.claude/)|\.md$|^LICENSE$' <<<"$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  contracts:
    name: specs, OpenAPI, Quadlet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run spec:validate
      - name: Finished OpenSpec changes are archived
        run: mise run spec:check-archived
      - run: mise run lint:openapi
      - name: Generated Go types match the contract
        run: mise run check:generated
      - name: Quadlet units generate (dry run)
        run: QUADLET_UNIT_DIRS="$PWD/contrib/quadlet" /usr/libexec/podman/quadlet -dryrun -user
      - name: compose.yaml is valid
        run: docker compose -f compose.yaml config -q

  unit:
    name: unit (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: gofmt
        working-directory: api
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "run gofmt -w on the files above" >&2; exit 1; }
      - name: go vet
        working-directory: api
        run: go vet ./... && go vet -tags e2e ./e2e/
      - name: go test -race
        working-directory: api
        run: go test -race ./...
      - name: Build test image
        run: docker build -f container/Containerfile --target test -t organon:test .
      - name: ERT (inside the test image)
        run: CONTAINER_RUNTIME=docker mise run test:elisp

  e2e:
    name: e2e ${{ matrix.runtime }} (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime: [compose, podman]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - name: Build image (Docker)
        if: matrix.runtime == 'compose'
        run: docker build -f container/Containerfile -t organon:dev .
      - name: Build image (Podman)
        if: matrix.runtime == 'podman'
        run: podman build -f container/Containerfile -t organon:dev .
      - name: e2e
        run: mise exec -- scripts/e2e.sh --runtime ${{ matrix.runtime }} -- -v
      - name: e2e as UID 12345
        if: matrix.runtime == 'podman'
        run: mise exec -- scripts/e2e.sh --runtime podman --uid 12345 -- -v

  # Publishes every commit on main that passed CI to GHCR as one multi-arch
  # image tagged `sha-<7>` and `main` (openspec/specs/deployment: Published
  # images). Each architecture is built natively and pushed by digest; the
  # digests are then merged into one manifest list. Pull requests, forks and
  # commits whose unit or e2e jobs did not succeed never reach these jobs.
  publish:
    name: publish (${{ matrix.arch }})
    needs: [contracts, unit, e2e]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      github.repository == 'FelisCatusKR/organon' &&
      needs.contracts.result == 'success' && needs.unit.result == 'success' &&
      needs.e2e.result == 'success'
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/organon
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: container/Containerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: publish (manifest)
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/feliscatuskr/organon
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
      - name: Verify the published image
        run: |
          ref="$IMAGE:sha-${GITHUB_SHA::7}"
          docker buildx imagetools inspect "$ref"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')
          test "$platforms" = "amd64,arm64" || { echo "platforms: $platforms" >&2; exit 1; }
          test "$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Manifest.Digest}}')" = \
               "$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}')"
          docker pull -q "$ref"
          test "$(docker image inspect "$ref" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          test "$(docker run --rm "$ref" organon version)" = "main-${GITHUB_SHA::7}"
